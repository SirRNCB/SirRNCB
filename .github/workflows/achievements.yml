name: Achievements

on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Your file will be saved as achievements.svg
          filename: achievements.svg
          
          # The Secret you just updated
          token: ${{ secrets.METRICS_TOKEN }}
          
          # "base: """ tells it to skip the big stats card (we just want achievements)
          base: ""
          
          # The Achievements Configuration (Based on your docs)
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
