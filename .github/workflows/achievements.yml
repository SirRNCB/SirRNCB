name: Achievements

on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Basic Settings
          filename: achievements.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: "" # Skip the base stats, we just want the trophies
          
          # Achievements Plugin - Minimal Configuration
          plugin_achievements: yes
          plugin_achievements_display: compact # Let's try compact first (it crashes less)
          plugin_achievements_threshold: C
