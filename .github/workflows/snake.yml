name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # Runs every midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            # 1. Void Color (#161b22) -> Standard Green Dots -> Crimson Snake (#DC143C)
            dist/github-contribution-grid-snake.svg?color_snake=#DC143C&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
