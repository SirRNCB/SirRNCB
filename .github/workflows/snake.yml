name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          # CHANGE THIS: Put a busy username here!
          # Examples: "torvalds" (Linus Torvalds), "rafaballerini", or "actions-user"
          github_user_name: torvalds 
          
          outputs: |
            # Void Background -> Red/Lava Squares -> Crimson Snake
            dist/github-contribution-grid-snake.svg?color_snake=#DC143C&color_dots=#161b22,#450a0a,#7f1d1d,#b91c1c,#ef4444
            
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
